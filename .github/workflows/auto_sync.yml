name: 🚀 13F Daily Auto Sync & Deploy

on:
  # ⏰ 매일 오전 6시(KST) 자동 실행 (UTC 기준 21:00)
  schedule:
    - cron: '0 21 * * *'
  # 🔘 GitHub 웹 화면에서 'Run workflow' 버튼으로 언제든 수동 실행 가능
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.10 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 필수 라이브러리 설치
        run: |
          pip install requests pandas

      - name: 🔍 SEC EDGAR 13F 및 야후 파이낸스 실시간 주가 일괄 수집
        run: |
          python collector_1year.py
          python sec_collector.py
          python price_fetcher.py

      - name: 💾 최신 데이터 GitHub 저장소에 자동 커밋 & 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_13f_holdings.csv latest_13f_holdings.json live_13f_analytics.json realtime_prices.json
          git commit -m "chore(data): 🤖 13F 공시 및 실시간 시장 주가 자동 수집 [skip ci]" || echo "No changes to commit"
          git push
