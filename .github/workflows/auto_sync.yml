name: 🚀 Alpha13F 스마트 하이브리드 수집 엔진

on:
  # ⏰ 1) 매일 오전 6시 (KST): 야후 파이낸스 실시간 주가만 초고속 2초 갱신
  schedule:
    - cron: '0 21 * * *'
  # 🔘 2) GitHub 웹 화면 또는 대시보드에서 수동 실행 시: 13F 풀 데이터 + 주가 일괄 갱신
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'SEC 13F 전체 공시까지 풀 갱신할까요?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  smart-sync:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.10 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 필수 라이브러리 설치
        run: |
          pip install requests pandas

      # 🔍 수동 트리거(full_sync=true) 또는 공시 집중 시즌일 때만 무거운 13F 풀 수집 실행
      - name: 📑 SEC EDGAR 13F 공식 공시 풀 수집 (수동/시즌 전용)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.full_sync == 'true'
        run: |
          echo "🚀 [Full Sync] SEC 13F 전체 100인 공시 수집을 실행합니다..."
          python collector_1year.py
          python sec_collector.py

      # 📈 매일 아침(한국시간 오전 6시 / 미국 장마감 직후): 주가 및 Form 4 내부자/13D 공시 자동 갱신
      - name: 📈 야후 실시간 주가 + SEC Form 4 내부자 + 13D 공시 데일리 갱신
        run: |
          echo "📡 [Daily Sync] 실시간 주가 및 SEC Form 4 / 13D 공시 데이터를 갱신합니다..."
          python price_fetcher.py
          python sec_insider_collector.py
          python sec_13d_collector.py

      - name: 💾 최신 데이터 GitHub 저장소에 자동 커밋 & 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add realtime_prices.json latest_13f_holdings.csv latest_13f_holdings.json live_13f_analytics.json latest_form4_insiders.json latest_13d_filings.json
          git commit -m "chore(data): 🤖 실시간 주가 및 Form 4/13D 공시 스마트 자동 동기화 [skip ci]" || echo "No changes to commit"
          git push
