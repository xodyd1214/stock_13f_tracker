name: Alpha13F validated quotes and macro refresh

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Serial publication prevents scheduled/manual refreshes racing over cache data.
concurrency:
  group: alpha13f-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smart-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install requests
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Run frontend regression tests
        run: node --test tests/*.test.cjs

      # Legacy 13F collectors do not implement the source-replayed partial
      # contract. Never publish their output. Preparing a new partial generation
      # is a separate reviewed process; this workflow cannot move its pointer.
      - name: Refresh prices
        id: prices
        continue-on-error: true
        run: python price_fetcher.py
      - name: Refresh macro indicators
        id: macro
        continue-on-error: true
        run: python macro_collector.py

      # latest_13f_holdings.csv is a retained legacy snapshot, not regenerated or
      # published by this workflow. Use the dashboard CSV export for current data.
      # sec_insider_collector.py and sec_13d_collector.py are
      # intentionally paused until their parsing and failure-preservation paths
      # are audited. Preserve existing legacy datasets; never publish their output.
      - name: Validate and publish only changed safe datasets
        if: ${{ !cancelled() && (steps.prices.outcome == 'success' || steps.prices.outcome == 'failure' || steps.macro.outcome == 'success' || steps.macro.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          outputs=(realtime_prices.json latest_macro_indicators.json)
          changed=()
          for file in "${outputs[@]}"; do
            if [[ -n "$(git status --porcelain -- "$file")" ]]; then
              python validate_data.py "$file"
              changed+=("$file")
            fi
          done
          if (( ${#changed[@]} == 0 )); then
            echo "No validated data changed. Existing snapshots retained."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- "${changed[@]}"
          git commit -m 'chore(data): publish validated source updates [skip ci]'
          git push

      - name: Report partial collection failure
        if: ${{ always() && (steps.prices.outcome == 'failure' || steps.macro.outcome == 'failure') }}
        run: |
          echo '::error::One or more collectors failed or returned partial/stale data. Successful validated updates were retained; review collector logs.'
          exit 1

